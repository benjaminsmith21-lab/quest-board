<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quest Board</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1f3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quest Board">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1f3b; --bg2:#262b52; --ink:#fff; --muted:#aab0e0;
    --k0:#ff9f43; --k0d:#a85d14; --k1:#2ecc9a; --k1d:#167a5b;
    --good:#2ecc71; --warn:#f6c343; --bad:#ff5e5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 20% 0%,#2f3670 0%,var(--bg) 60%);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;padding:10px 14px 14px;gap:10px}
  header{display:flex;align-items:center;gap:14px;position:relative;min-height:56px}
  header.centred .countdown{visibility:hidden}
  header.centred .dt{position:absolute;left:50%;transform:translateX(-50%);text-align:center;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
  .day{font-size:clamp(20px,3.2vw,34px);font-weight:800;line-height:1}
  .clock{font-size:clamp(16px,2.4vw,26px);color:var(--muted);font-weight:700}
  .countdown{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
  .cd-label{font-size:clamp(13px,1.6vw,17px);font-weight:700;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cd-label.big{font-size:clamp(20px,3vw,34px);font-weight:800;color:#fff}
  .road{position:relative;height:clamp(40px,5.5vw,58px);border-radius:99px;background:#0e1130;overflow:visible}
  .road-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#3b4a9e,#7d6bff);transition:width 1s linear}
  .mover{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(28px,4vw,44px);line-height:1;transition:left 1s linear}
  .car{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:clamp(30px,4.2vw,46px);line-height:1}
  .cd-fill{height:100%;width:100%;border-radius:99px;background:var(--good);transition:width 1s linear,background .5s}
  .iconbtn{width:52px;height:52px;border-radius:16px;border:none;background:var(--bg2);color:#fff;font-size:26px;position:relative;flex:none;cursor:pointer}
  .iconbtn svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
  .iconbtn svg.ring circle{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:151;stroke-dashoffset:151}
  .iconbtn.holding svg.ring circle{transition:stroke-dashoffset 1.5s linear;stroke-dashoffset:0}
  main{flex:1;display:flex;gap:14px;min-height:0}
  .lane{flex:1;display:flex;flex-direction:column;background:var(--bg2);border-radius:24px;padding:12px;gap:10px;min-width:0;border:4px solid transparent;position:relative;overflow:hidden}
  .lane.k0{--c:var(--k0);--cd:var(--k0d)} .lane.k1{--c:var(--k1);--cd:var(--k1d)}
  .lane.complete{border-color:var(--c);box-shadow:0 0 30px var(--c)}
  .lane-head{display:flex;align-items:center;gap:10px}
  .avatar{font-size:clamp(36px,5.5vw,60px);line-height:1;transition:transform .3s}
  .lane.complete .avatar{animation:bounce 1s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(-8deg)}}
  .name{font-size:clamp(22px,3.4vw,38px);font-weight:800;line-height:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .streak{font-size:clamp(16px,2.2vw,24px);font-weight:800;background:#0e1130;padding:4px 12px;border-radius:99px;white-space:nowrap}
  .prog{height:18px;border-radius:99px;background:#0e1130;overflow:hidden}
  .prog-fill{height:100%;background:var(--c);border-radius:99px;transition:width .4s cubic-bezier(.3,1.6,.6,1)}
  .tiles{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,13vw,150px),1fr));grid-auto-rows:minmax(90px,1fr);gap:10px;overflow-y:auto;align-content:start}
  .tile{border:none;border-radius:20px;background:#363d75;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-family:inherit;position:relative;cursor:pointer;transition:transform .12s,background .2s;box-shadow:0 5px 0 #1a1f45}
  .tile:active{transform:translateY(3px);box-shadow:0 2px 0 #1a1f45}
  .tile .em{font-size:clamp(34px,5vw,56px);line-height:1.1}
  .tile .lb{font-size:clamp(13px,1.6vw,19px);font-weight:700;line-height:1.1;text-align:center;margin-top:4px}
  .tile.done{background:var(--c);box-shadow:0 5px 0 var(--cd)}
  .tile.done .em{opacity:.35}
  .tile .tick{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(44px,6vw,70px)}
  .tile.done .tick{display:flex;animation:pop .35s cubic-bezier(.3,1.8,.6,1)}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .empty{color:var(--muted);text-align:center;margin:auto;font-size:22px}
  .banner{position:absolute;left:0;right:0;bottom:0;background:var(--c);color:#111;text-align:center;font-weight:800;font-size:clamp(20px,3vw,32px);padding:8px;transform:translateY(100%);transition:transform .4s}
  .lane.complete .banner{transform:none}
  .confetti{position:fixed;top:-60px;font-size:34px;pointer-events:none;z-index:50;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
  @media (orientation:portrait){main{flex-direction:column}}

  /* hold to undo */
  .tile.done{touch-action:none}
  .tile .hold{position:absolute;left:0;bottom:0;height:8px;width:0;background:#fff;border-radius:0 0 20px 20px;opacity:.9}
  .tile.holding .hold{width:100%;transition:width 1.5s linear}
  .tile.hinted::after{content:'Hold to undo';position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#0e1130;color:#fff;font-size:13px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;z-index:2}

  /* one at a time (Now & Next) */
  .nn{flex:1;display:flex;gap:16px;min-height:0;align-items:stretch}
  .tile.nn-now{flex:2.2;border-radius:30px;box-shadow:0 8px 0 #1a1f45;animation:nudge 2.4s ease-in-out infinite}
  .lane.solo .tile.nn-now .em{font-size:clamp(90px,15vw,180px)}
  .lane.solo .tile.nn-now .lb{font-size:clamp(26px,3.8vw,46px)}
  @keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  .nn-next{flex:1;background:#0e1130;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.75;padding:8px}
  .nn-next .nn-cap{font-size:clamp(18px,2.6vw,30px);font-weight:800;color:var(--muted)}
  .nn-next .em{font-size:clamp(54px,8vw,96px);line-height:1.1}
  .nn-next .lb{font-size:clamp(15px,2vw,22px);font-weight:700;text-align:center}
  .nn-done{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(100px,18vw,200px)}
  .nn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .tile.mini{width:clamp(54px,7vw,76px);height:clamp(54px,7vw,76px);border-radius:16px;box-shadow:0 4px 0 #1a1f45;padding:0}
  .lane.solo .tile.mini .em{font-size:clamp(26px,3.6vw,40px)}
  .lane.solo .tile.mini .tick{font-size:clamp(26px,3.6vw,40px)}
  .tile.mini.hinted::after{font-size:11px;top:-22px}

  /* badges, many kids, milestone banner */
  .kbadges{position:absolute;top:12px;right:14px;display:flex;gap:6px}
  .lbadges{display:flex;gap:6px;flex:none}
  .pill{font-size:clamp(16px,2.2vw,24px);font-weight:800;background:#0e1130;padding:4px 12px;border-radius:99px;white-space:nowrap}
  main.many{flex-wrap:wrap}
  main.many .kcard{flex:1 1 40%}
  main.many .ring{width:clamp(80px,12vw,140px)}
  main.many .ring-inner{font-size:clamp(40px,6vw,74px)}
  .mile{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,40,.82);pointer-events:none;animation:mileIn .5s cubic-bezier(.3,1.6,.6,1);transition:opacity .6s}
  .mile.out{opacity:0}
  .mile-big{font-size:clamp(90px,16vw,200px);font-weight:800;line-height:1;text-shadow:0 0 40px #ffd23f}
  .mile-small{font-size:clamp(24px,3.6vw,44px);font-weight:800;margin-top:12px;text-align:center;padding:0 20px}
  @keyframes mileIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* upcoming events strip */
  .events{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .evchip{display:flex;align-items:center;gap:10px;background:var(--bg2);border:3px solid #444b8a;border-radius:18px;padding:4px 14px 4px 8px;color:#fff;font-family:inherit;cursor:pointer}
  .evchip.today{border-color:#ffd23f;box-shadow:0 0 18px rgba(255,210,63,.5)}
  .evemo{font-size:clamp(28px,3.6vw,40px);line-height:1}
  .evtxt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
  .evname{font-size:clamp(13px,1.6vw,17px);font-weight:700;color:var(--muted)}
  .evdays{font-size:clamp(18px,2.4vw,26px);font-weight:800}

  /* morning / afternoon tabs */
  .ptabs{display:flex;gap:10px;justify-content:center}
  .ptab{font-family:inherit;font-weight:800;font-size:clamp(14px,1.8vw,20px);padding:4px 18px;border-radius:99px;border:none;background:var(--bg2);color:var(--muted);cursor:pointer}
  .ptab.sel{background:#fff;color:#1b1f3b}

  /* home cards */
  .kcard{flex:1;min-width:0;border:5px solid var(--c);border-radius:30px;background:var(--bg2);color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;box-shadow:0 8px 0 var(--cd);transition:transform .12s;padding:12px}
  .kcard:active{transform:translateY(4px);box-shadow:0 4px 0 var(--cd)}
  .kcard.k0{--c:var(--k0);--cd:var(--k0d)} .kcard.k1{--c:var(--k1);--cd:var(--k1d)}
  .kcard.complete{box-shadow:0 0 34px var(--c),0 8px 0 var(--cd)}
  .ring{width:clamp(120px,20vw,230px);aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .4s}
  .ring-inner{width:80%;height:80%;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:clamp(60px,10vw,120px);line-height:1}
  .kcard.complete .ring-inner{animation:bounce 1s infinite}
  .kname{font-size:clamp(28px,4.6vw,54px);font-weight:800;line-height:1}
  .kcount{font-size:clamp(16px,2.2vw,24px);color:var(--muted);font-weight:700}
  .knext{background:#0e1130;border-radius:16px;padding:6px 18px;font-size:clamp(18px,2.8vw,32px);font-weight:800;text-align:center}
  .kstreak{position:absolute;top:12px;right:14px;font-size:clamp(16px,2.2vw,24px);font-weight:800;background:#0e1130;padding:4px 12px;border-radius:99px}
  /* one kid's page */
  .homebtn{width:clamp(54px,7vw,72px);height:clamp(54px,7vw,72px);border-radius:18px;border:none;background:#0e1130;color:#fff;font-size:clamp(28px,4vw,40px);cursor:pointer;flex:none}
  .ochip{border-radius:14px;padding:4px 12px;font-size:clamp(22px,3.2vw,36px);flex:none;white-space:nowrap}
  .lane.solo .tiles{grid-template-columns:repeat(auto-fill,minmax(clamp(130px,18vw,220px),1fr));grid-auto-rows:minmax(120px,1fr);gap:14px}
  .lane.solo .tile .em{font-size:clamp(48px,7vw,80px)}
  .lane.solo .tile .lb{font-size:clamp(16px,2.1vw,24px)}
  .lane.solo .prog{height:24px}

  /* weather */
  .wx{display:flex;align-items:center;gap:14px;background:var(--bg2);border-radius:20px;padding:8px 14px;border:4px solid var(--wc,#444b8a);cursor:pointer}
  .wx-badge{display:flex;align-items:center;gap:6px;background:var(--wc,#444b8a);color:#111;border-radius:16px;padding:4px 14px;font-weight:800;font-size:clamp(24px,3.6vw,40px);flex:none}
  .wx-text{flex:none;min-width:0;max-width:30%}
  .wx-title{font-size:clamp(18px,2.6vw,30px);font-weight:800;line-height:1.05;color:var(--wc,#fff)}
  .wx-sub{font-size:clamp(11px,1.3vw,14px);color:var(--muted);font-weight:600;margin-top:2px}
  .wx-wear{flex:1;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .wear{display:flex;flex-direction:column;align-items:center;background:#0e1130;border-radius:16px;padding:6px 12px;min-width:84px}
  .wear .e{font-size:clamp(40px,6vw,64px);line-height:1.1}
  .wear .t{font-size:clamp(12px,1.5vw,17px);font-weight:700;color:#fff}
  .wx.off{opacity:.6}

  /* UV */
  .uv{display:flex;align-items:center;gap:14px;background:var(--bg2);border-radius:20px;padding:8px 14px;border:4px solid var(--uc,#444b8a);cursor:pointer}
  .uv-light{width:clamp(40px,5.5vw,62px);height:clamp(40px,5.5vw,62px);border-radius:50%;background:var(--uc,#444b8a);box-shadow:0 0 22px var(--uc,transparent);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(18px,2.6vw,28px);color:#111}
  .uv-text{flex:1;min-width:0}
  .uv-title{font-size:clamp(18px,2.6vw,30px);font-weight:800;line-height:1.05;color:var(--uc,#fff)}
  .uv-sub{font-size:clamp(13px,1.7vw,19px);color:var(--muted);font-weight:700}
  .uv-strip{display:flex;gap:3px;align-items:flex-end;flex:none}
  .uvh{display:flex;flex-direction:column;align-items:center;gap:2px}
  .uvh .b{width:clamp(16px,2.2vw,28px);height:clamp(22px,3vw,34px);border-radius:6px}
  .uvh .l{font-size:clamp(10px,1.2vw,13px);color:var(--muted);font-weight:700}
  .uvh.now .b{outline:3px solid #fff;outline-offset:1px}
  .uv.off{opacity:.6}

  /* ===== settings layout ===== */
  .s-saved{color:var(--muted);font-size:15px;font-weight:600}
  #settings input[type=number],#settings input[type=date]{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid #444b8a;background:#0e1130;color:#fff;color-scheme:dark}
  #settings input[type=text]{color-scheme:dark}
  .s-wrap>*{min-width:0}
  .bigname{width:100%}
  .s-wrap{flex:1;display:flex;min-height:0}
  .s-nav{width:210px;flex:none;background:#171b45;padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
  .s-nav button{display:flex;align-items:center;gap:12px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:18px;font-weight:700;padding:11px 14px;border-radius:12px;cursor:pointer;text-align:left;white-space:nowrap}
  .s-nav button .ni{font-size:22px}
  .s-nav button.sel{background:#2f3670;color:#fff}
  .s-body{flex:1;overflow-y:auto;padding:20px 22px 40px;display:block}
  .s-inner{max-width:860px;margin:0 auto}
  .stitle{margin:0 0 4px;font-size:28px}
  .ssub{color:var(--muted);font-size:16px;margin:0 0 16px}
  .scard{background:var(--bg2);border-radius:18px;padding:16px 18px;margin-bottom:14px}
  .scard>h3{margin:0 0 2px;font-size:20px;color:#fff}
  .scard>.desc{color:var(--muted);font-size:15px;margin:0 0 8px}
  .field{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
  .scard>.field:first-child,.scard>h3+.field,.scard>.desc+.field,.body>.field:first-child{border-top:none}
  .fl{flex:1;min-width:0}.fl b{display:block;font-size:17px}.fl span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
  .fc{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
  .muted{color:var(--muted);font-size:16px}
  .status{background:#0e1130;border-radius:12px;padding:10px 12px;font-size:15px;margin:8px 0 0}
  .switch{position:relative;display:inline-block;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .tr{display:block;width:54px;height:32px;border-radius:99px;background:#444b8a;transition:background .2s;position:relative}
  .switch .tr::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .switch input:checked+.tr{background:var(--good)}
  .switch input:checked+.tr::after{left:26px}
  .seg{display:inline-flex;flex-wrap:wrap;background:#0e1130;border-radius:12px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:16px;padding:8px 13px;border-radius:9px;cursor:pointer}
  .seg button.sel{background:#fff;color:#1b1f3b}
  .linkbtn{background:none;border:none;color:#ff8a8a;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:6px}
  .kidtop{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .avbtn{font-size:46px;line-height:1;background:#0e1130;border:2px dashed #444b8a;border-radius:18px;width:78px;height:78px;cursor:pointer;flex:none}
  .bigname{flex:1;min-width:0;font-size:24px !important;font-weight:800;padding:10px 12px !important}
  .avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:#0e1130;border-radius:14px;padding:8px;margin:8px 0}
  .avgrid button{font-size:30px;background:transparent;border:2px solid transparent;border-radius:12px;padding:4px;cursor:pointer}
  .avgrid button.sel{border-color:var(--warn)}
  .addcard{width:100%;padding:18px;border-radius:18px;border:2px dashed #444b8a;background:transparent;color:#fff;font-family:inherit;font-size:19px;font-weight:800;cursor:pointer;margin-bottom:8px}
  .qwrap{overflow-x:auto;margin-top:10px}
  .qtable{width:100%;border-collapse:collapse}
  .qtable th{padding:6px 4px;text-align:center;font-weight:700;vertical-align:bottom}
  .qtable td{padding:4px;text-align:center;border-top:1px solid rgba(255,255,255,.06)}
  .qtable td.ql,.qtable th.ql{text-align:left;width:100%}
  .qtable td.ql{display:flex;align-items:center;gap:10px;font-size:17px;padding:8px 4px}
  .qav{font-size:30px;line-height:1}.qnm{font-size:13px;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qic{font-size:26px;width:34px;text-align:center}
  .qgroup td{text-align:left;color:var(--warn);font-weight:800;font-size:16px;padding-top:14px;border-top:none}
  .qpill{width:48px;height:38px;border-radius:12px;border:2px solid #444b8a;background:transparent;color:#06301a;font-size:20px;font-weight:800;cursor:pointer}
  .qpill.on{background:var(--good);border-color:var(--good)}
  details.item{background:#0e1130;border-radius:14px;margin-top:8px}
  details.item>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;font-size:17px;font-weight:700}
  details.item>summary::-webkit-details-marker{display:none}
  details.item>summary::after{content:'▾';margin-left:auto;color:var(--muted);transition:transform .2s}
  details.item[open]>summary::after{transform:rotate(180deg)}
  .iic{font-size:26px;width:34px;text-align:center;flex:none}
  .iname{flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:13px;padding:3px 9px;border-radius:99px;background:#2f3670;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  details.item .body{padding:2px 14px 14px}
  input.emo{width:64px;text-align:center;font-size:22px}
  .legend{display:flex;flex-wrap:wrap;gap:8px}

  /* settings */
  #settings{position:fixed;inset:0;background:#12153a;z-index:100;display:none;flex-direction:column}
  #settings.open{display:flex}
  .s-head{display:flex;align-items:center;padding:12px 16px;gap:12px;background:var(--bg2)}
  .s-head h2{margin:0;flex:1;font-size:26px}
  .s-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:22px;user-select:text;-webkit-user-select:text}

  .card{background:var(--bg2);border-radius:16px;padding:14px}

  input[type=text],input[type=time],select{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid #444b8a;background:#0e1130;color:#fff}
  input[type=text]{min-width:0}
  .btn{font-family:inherit;font-size:18px;font-weight:700;padding:9px 16px;border-radius:12px;border:none;background:#444b8a;color:#fff;cursor:pointer}
  .btn.primary{background:var(--good);color:#06301a}
  .btn.danger{background:var(--bad)}
  .daytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .daytabs button{font-family:inherit;font-size:18px;font-weight:800;padding:8px 14px;border-radius:12px;border:none;background:#0e1130;color:#fff;cursor:pointer}
  .daytabs button.sel{background:var(--warn);color:#2a2000}

  .tile .tick{inset:auto;top:8px;right:10px;font-size:clamp(26px,3.4vw,40px)}

  .svgicon{height:1.3em;width:1.3em;vertical-align:-0.2em;margin:-0.15em}

<body>

  <header>

<div id="settings">

  <div class="s-wrap"><nav class="s-nav" id="sNav"></nav><div class="s-body" id="sBody"></div></div>
</div>

<script>
(function(){
  var BOARD_VERSION='10 Nov 2026 · tidy settings';
  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var AVATARS=['🦊','🐢','🦁','🐼','🐸','🦄','🐯','🐵','🐶','🐱','🦖','🐙','🚀','🦕','🐨','🐧'];
  var PRAISE=['superstar','champ','legend','great job','well done','nice work'];
  // ----- "You brushed your teeth, superstar!" -----
  // Hand-written lines for the built-in quests (used while their label is unchanged)
  var DEFAULT_SAY={
    toilet:['Toilet & wash hands','You went to the toilet and washed your hands'],
    dress:['Get dressed','You got dressed'],
    breakfast:['Eat breakfast','You ate your breakfast'],
    teeth:['Brush teeth','You brushed your teeth'],
    hair:['Brush hair','You brushed your hair'],
    sunscreen:['Sunscreen','You put on your sunscreen'],
    bag:['Pack bag','You packed your bag'],
    shoes:['Shoes & hat','You put on your shoes and hat'],
    swim:['Swim bag','You packed your swim bag'],
    library:['Library bag','You packed your library bag'],
    sport:['Sports uniform','You put on your sports uniform'],
    bed:['Make bed','You made your bed'],
    tidy:['Tidy one thing','You tidied something up'],
    reading:['Reading','You did your reading'],
    lunchbox:['Put lunchbox away','You put your lunchbox away'],
    dishes:['Put dishes away','You put your dishes away'],
    pyjamas:['Get pyjamas ready','You got your pyjamas ready']
  };
  var IRREG={get:'got',eat:'ate',make:'made',put:'put',take:'took',go:'went','do':'did',feed:'fed',read:'read',write:'wrote',
    give:'gave',bring:'brought',have:'had',drink:'drank',hang:'hung',find:'found',set:'set',sweep:'swept',wear:'wore',say:'said',
    sit:'sat',run:'ran',swim:'swam',ride:'rode',draw:'drew',sing:'sang',buy:'bought',teach:'taught',throw:'threw',shut:'shut',
    sleep:'slept',wake:'woke',lay:'laid',let:'let',hold:'held',keep:'kept',leave:'left',send:'sent',spend:'spent',build:'built',
    stand:'stood',tell:'told',think:'thought',fold:'folded',feed:'fed',blow:'blew',grab:'grabbed',hug:'hugged',mop:'mopped',
    wipe:'wiped','pick':'picked',plan:'planned',stop:'stopped',drop:'dropped',chop:'chopped',scrub:'scrubbed',
    practice:'practised',practise:'practised'};
  // Common action words, so custom quests like "Feed the cat" or "Unpack lunchbox" are recognised as actions
  var VERBS=('brush wash pack unpack clean tidy empty fill water change pull flush help finish check call play walk dress '+
    'comb pour clear load unload carry fix count spell learn listen look open close turn switch pack collect sort match '+
    'charge cook bake stretch jump dance kick climb hop skip tie zip button hang fold put get eat make take go do feed read '+
    'write give bring have drink find set sweep wear say sit run swim ride draw sing buy throw shut sleep wake lay hold keep '+
    'leave send build stand tell blow grab hug mop wipe pick stop drop chop scrub practice practise').split(' ');
  var PARTICLES=['on','off','up','away','out','in','down','back','over'];
  var DETS=['a','an','the','my','your','his','her','their','our','one','two','three','some','all','every','this','that','these','those','any','each'];
  function pastOf(v){
    v=v.toLowerCase();
    if(IRREG[v])return IRREG[v];
    if(/e$/.test(v))return v+'d';
    if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+'ied';
    if(/^[^aeiou]*[aeiou][bdgmnprt]$/.test(v)&&v.length<=4)return v+v.slice(-1)+'ed';
    return v+'ed';
  }
  function yourify(words){ // "teeth" -> "your teeth", "the cat" stays, "my bag" -> "your bag"
    if(!words.length)return '';
    var w0=words[0].toLowerCase();
    if(w0==='my')return ['your'].concat(words.slice(1)).join(' ');
    var PREPS=['to','with','for','at','into','onto','outside','inside','home','around','by','from','through'];
    if(DETS.indexOf(w0)>-1||PREPS.indexOf(w0)>-1||/ed$/.test(w0)||/^[A-Z]/.test(words[0]))return words.join(' ');
    return 'your '+words.join(' ');
  }
  function pastPhrase(s){
    if(s.say&&s.say.trim())return s.say.trim().replace(/[.!]+$/,'');
    var d=DEFAULT_SAY[s.id];
    if(d&&d[0]===s.label)return d[1];
    var label=s.label.replace(/&/g,' and ').replace(/\s+/g,' ').trim().replace(/[.!]+$/,'');
    var parts=label.split(' ');
    var verb=parts[0].toLowerCase();
    if(VERBS.indexOf(verb)<0&&!IRREG[verb]){ // a thing, not an action: "Fruit for kinder" -> "You remembered your fruit for kinder"
      var lw=label.split(' ');lw[0]=lw[0].toLowerCase();return 'You remembered '+yourify(lw);
    }
    var rest=parts.slice(1),out=['You',pastOf(verb)];
    if(rest.length&&PARTICLES.indexOf(rest[0].toLowerCase())>-1){out.push(rest[0].toLowerCase());rest=rest.slice(1);}
    // "Brush teeth and hair" -> "your teeth and your hair" is overkill: only the first noun gets "your"
    var obj=yourify(rest.map(function(w){return w;}));
    if(obj)out.push(obj);
    return out.join(' ');
  }
  function praiseLine(s){return pastPhrase(s)+', '+PRAISE[Math.floor(Math.random()*PRAISE.length)]+'!';}

  function defaults(){
    var steps=[
      {id:'toilet',emoji:'🚽',label:'Toilet & wash hands'},
      {id:'dress',emoji:'👕',label:'Get dressed'},
      {id:'breakfast',emoji:'🥣',label:'Eat breakfast'},
      {id:'teeth',emoji:'🪥',label:'Brush teeth'},
      {id:'hair',emoji:'🪮',label:'Brush hair'},
      {id:'sunscreen',emoji:'🧴',label:'Sunscreen'},
      {id:'bag',emoji:'🎒',label:'Pack bag'},
      {id:'shoes',emoji:'👟',label:'Shoes & hat'},
      {id:'swim',emoji:'🏊',label:'Swim bag'},
      {id:'library',emoji:'📚',label:'Library bag'},
      {id:'sport',emoji:'🧢',label:'Sports uniform'},
      {id:'bed',emoji:'🛏️',label:'Make bed'},
      {id:'tidy',emoji:'🧸',label:'Tidy one thing'},
      {id:'lunchbox',emoji:'🍱',label:'Put lunchbox away',period:'pm'},
      {id:'reading',emoji:'📖',label:'Reading',period:'pm'},
      {id:'dishes',emoji:'🍽️',label:'Put dishes away',period:'pm'},
      {id:'pyjamas',emoji:'🛌',label:'Get pyjamas ready',period:'pm'}
    ];
    var wk0=['toilet','dress','breakfast','teeth','hair','sunscreen','bag','shoes'];
    var wk1=['toilet','dress','breakfast','teeth','hair','sunscreen','shoes'];
    var we0=['toilet','dress','breakfast','teeth','bed','tidy'];
    var we1=['toilet','dress','breakfast','teeth','tidy'];
    var days={};
    for(var d=0;d<7;d++){
      var weekend=(d===0||d===6);
      var pm=(weekend?[]:['lunchbox']).concat(['reading','dishes','pyjamas']);
      days[d]={leave:weekend?'':'08:15',kids:[(weekend?we0:wk0).concat(pm),(weekend?we1:wk1).concat(pm)]};
    }
    return {kids:[{name:'Big Kid',emoji:'🦊'},{name:'Little Kid',emoji:'🐢'}],steps:steps,days:days,voice:true,arvoStart:'12:00',v:2};
  }

  // ---------- storage ----------
  function load(key,fallback){
    try{var v=localStorage.getItem(key);if(v)return JSON.parse(v);}catch(e){}
    try{var b=localStorage.getItem(key+'_backup');if(b)return JSON.parse(b);}catch(e){}  // fall back to the backup copy
    return fallback;
  }
  function save(key,val){
    try{var j=JSON.stringify(val);localStorage.setItem(key,j);if(key==='qb_cfg'){localStorage.setItem(key+'_backup',j);localStorage.setItem('qb_saved_at',String(Date.now()));}}catch(e){}
  }
  // Ask the browser to treat this board's data as important so it isn't cleared to free up space
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

  var cfg=load('qb_cfg',null)||defaults();
  // v2: afternoon ("arvo") quests, with daily Reading for both kids
  if(!cfg.v||cfg.v<2){
    if(!stepByIdRaw('reading'))cfg.steps.push({id:'reading',emoji:'📖',label:'Reading',period:'pm'});
    for(var dd=0;dd<7;dd++)for(var kk=0;kk<2;kk++){var arr0=cfg.days[dd].kids[kk];if(arr0.indexOf('reading')<0)arr0.push('reading');}
    if(!cfg.arvoStart)cfg.arvoStart='12:00';
    cfg.v=2;try{localStorage.setItem('qb_cfg',JSON.stringify(cfg));}catch(e){}
  }
  // v3: per-kid board style. Little one gets "one at a time" by default.
  if(cfg.v<3){
    cfg.kids[0].mode=cfg.kids[0].mode||'grid';cfg.kids[1].mode=cfg.kids[1].mode||'nownext';
    cfg.v=3;try{localStorage.setItem('qb_cfg',JSON.stringify(cfg));}catch(e){}
  }
  // v4: any number of children; per-child reading count and star jar (replaces streaks)
  if(cfg.v<4){
    cfg.kids.forEach(function(kd){kd.reads=kd.reads||{count:0,last:'',prev:''};kd.stars=kd.stars||{count:0,last:'',prev:''};kd.mode=kd.mode||'grid';});
    cfg.v=4;try{localStorage.setItem('qb_cfg',JSON.stringify(cfg));}catch(e){}
  }
  // v5: hairbrush icon, three new afternoon quests, warm-day clothes choice per child
  if(cfg.v<5){
    var hs=null;cfg.steps.forEach(function(x){if(x.id==='hair'&&x.emoji==='💇')x.emoji='🪮';});
    function addStep(st,beforeId,afterId){
      if(cfg.steps.some(function(x){return x.id===st.id;}))return false;
      var idx=-1;cfg.steps.forEach(function(x,i){if(x.id===(beforeId||afterId))idx=i;});
      if(idx<0)cfg.steps.push(st);else cfg.steps.splice(beforeId?idx:idx+1,0,st);
      return true;
    }
    var addL=addStep({id:'lunchbox',emoji:'🍱',label:'Put lunchbox away',period:'pm'},'reading');
    var addP=addStep({id:'pyjamas',emoji:'🛌',label:'Get pyjamas ready',period:'pm'},null,'reading');
    var addD=addStep({id:'dishes',emoji:'🍽️',label:'Put dishes away',period:'pm'},null,'reading');
    for(var d5=0;d5<7;d5++)cfg.days[d5].kids.forEach(function(list){
      if(addL&&d5>=1&&d5<=5&&list.indexOf('lunchbox')<0)list.push('lunchbox');
      if(addD&&list.indexOf('dishes')<0)list.push('dishes');
      if(addP&&list.indexOf('pyjamas')<0)list.push('pyjamas');
    });
    cfg.kids.forEach(function(kd){kd.clothes=kd.clothes||'shorts';});
    cfg.v=5;save('qb_cfg',cfg);
  }
  var PALETTE=[['#ff9f43','#a85d14'],['#2ecc9a','#167a5b'],['#5aa9ff','#2b5f99'],['#ff6fb5','#a33a6f'],['#b98cff','#6a45a8'],['#ffd23f','#9c7d10']];
  function kidColour(node,k){var c=PALETTE[k%PALETTE.length];node.style.setProperty('--c',c[0]);node.style.setProperty('--cd',c[1]);}
  function nKids(){return cfg.kids.length;}
  function normalize(){
    var n=nKids();
    for(var d=0;d<7;d++){var a=cfg.days[d].kids;while(a.length<n)a.push([]);if(a.length>n)a.length=n;}
    cfg.kids.forEach(function(kd){kd.reads=kd.reads||{count:0,last:'',prev:''};kd.stars=kd.stars||{count:0,last:'',prev:''};kd.mode=kd.mode||'grid';kd.clothes=kd.clothes||'shorts';});
  }
  normalize();
  function stepByIdRaw(id){for(var i=0;i<cfg.steps.length;i++)if(cfg.steps[i].id===id)return cfg.steps[i];return null;}
  function stepPeriod(s){return s.period==='pm'?'pm':'am';}
  function autoPeriod(){
    var p=(cfg.arvoStart||'12:00').split(':'),n=new Date();
    return (n.getHours()*60+n.getMinutes())>=(+p[0]*60+ +p[1])?'pm':'am';
  }
  var selPeriod=null,lastAuto=autoPeriod();
  function curPeriod(){var a=autoPeriod();if(a!==lastAuto){lastAuto=a;selPeriod=null;}return selPeriod||a;}
  var prog=load('qb_prog',null);

  function pad(n){return (n<10?'0':'')+n;}
  function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function today(){return dateKey(new Date());}
  function ensureProg(){
    if(!prog||prog.date!==today()){prog={date:today(),done:[],celebrated:{am:[],pm:[]}};}
    if(Array.isArray(prog.celebrated))prog.celebrated={am:prog.celebrated,pm:[]};
    var n=nKids();
    while(prog.done.length<n)prog.done.push([]);if(prog.done.length>n)prog.done.length=n;
    ['am','pm'].forEach(function(p){var a=prog.celebrated[p];while(a.length<n)a.push(false);if(a.length>n)a.length=n;});
    save('qb_prog',prog);
  }
  ensureProg();

  function stepById(id){for(var i=0;i<cfg.steps.length;i++)if(cfg.steps[i].id===id)return cfg.steps[i];return null;}
  function todaysSteps(k,period){
    period=period||curPeriod();
    var dc=cfg.days[new Date().getDay()];
    var ids=(dc.kids[k]||[]).filter(function(id){var s=stepByIdRaw(id);return s&&stepPeriod(s)===period;});
    // auto sunscreen from the UV forecast (falls back to the day's setting if no forecast) - mornings only
    var need=sunscreenNeeded();
    if(period==='am'&&cfg.autoSun!==false&&need!==null&&ids.length){
      var i=ids.indexOf('sunscreen');
      if(need&&i<0)ids.push('sunscreen');
      if(!need&&i>-1)ids.splice(i,1);
    }
    // keep library order
    return cfg.steps.filter(function(s){return ids.indexOf(s.id)>-1;});
  }

  // ---------- audio ----------
  var actx=null;
  function ctx(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
  function tone(freq,start,dur,type){
    var c=ctx();if(!c)return;
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||'triangle';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,c.currentTime+start);
    g.gain.exponentialRampToValueAtTime(0.3,c.currentTime+start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+start+dur);
    o.connect(g);g.connect(c.destination);o.start(c.currentTime+start);o.stop(c.currentTime+start+dur+0.05);
  }
  function blip(){tone(660,0,0.12);tone(990,0.08,0.18);}
  function undoSound(){tone(400,0,0.15,'sine');tone(300,0.1,0.2,'sine');}
  function fanfare(){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,i*0.12,0.25,'square');});}
  // ----- Natural AI voice (Piper, runs on the device; falls back to the tablet voice) -----
  var AI_VOICES=[
    ['en_GB-jenny_dioco-medium','Jenny (British, female)'],['en_GB-cori-medium','Cori (British, female)'],
    ['en_GB-alba-medium','Alba (Scottish, female)'],['en_GB-southern_english_female-low','Southern English (female, smaller download)'],
    ['en_GB-alan-medium','Alan (British, male)'],['en_GB-northern_english_male-medium','Northern English (male)'],
    ['en_US-hfc_female-medium','HFC (American, female)'],['en_US-amy-medium','Amy (American, female)'],
    ['en_US-lessac-medium','Lessac (American, female)'],['en_US-ryan-medium','Ryan (American, male)'],['en_US-joe-medium','Joe (American, male)']];
  if(!cfg.ai)cfg.ai={on:true,voice:'en_GB-jenny_dioco-medium'};
  var AI={state:'off',pct:0,voice:null,sess:null,cache:{},order:[],audio:null,token:0,err:''};
  function aiStatus(){
    var e=document.getElementById('aiStatus');if(!e)return;
    if(!cfg.ai.on)e.textContent='Off: using the tablet voice.';
    else if(AI.state==='ready')e.textContent='✅ Natural voice ready (saved on this device, works offline).';

      if(AI.voice&&AI.voice!==want)m.TtsSession._instance=null;
      return m.TtsSession.create({voiceId:want,wasmPaths:{onnxWasm:base,piperData:base+'piper_phonemize.data',piperWasm:base+'piper_phonemize.wasm'},
        progress:function(p){if(p&&p.total){AI.pct=Math.round(p.loaded*100/p.total);aiStatus();}}});

  function toggle(k,s){
    keepAwake();bumpIdle();
    var kd=cfg.kids[k],done=prog.done[k],i=done.indexOf(s.id),t=today();
    if(i>-1){
      done.splice(i,1);undoSound();
      // undo today's reading day and star if they were just earned
      if(s.id==='reading'&&kd.reads.last===t){kd.reads.count=Math.max(0,kd.reads.count-1);kd.reads.last=kd.reads.prev||'';}
      if(kd.stars.last===t&&!allDoneToday(k)){kd.stars.count=Math.max(0,kd.stars.count-1);kd.stars.last=kd.stars.prev||'';}
      save('qb_cfg',cfg);
    }
    else{
      done.push(s.id);

      var steps=todaysSteps(k,per);
      var left=steps.filter(function(x){return done.indexOf(x.id)<0;}).length;
      // reading count

        else lines.push(pastPhrase(s)+'! That is '+rc+(rc===1?' day':' days')+' of reading. Great job!');
      }
      else if(left>0){lines.push(praiseLine(s));}
      else lines.push(pastPhrase(s)+'!');
      if(left===0){
        big=true;
        lines.push('Hooray '+kd.name+'! All done'+(per==='pm'?' for the afternoon':' for the morning')+'!');
        prog.celebrated[per][k]=true;
      }
      // star jar: everything done for the whole day
      var star=false;
      if(allDoneToday(k)&&kd.stars.last!==t){
        kd.stars.prev=kd.stars.last;kd.stars.last=t;kd.stars.count=(kd.stars.count||0)+1;star=true;
        lines.push('You earned a star for your star jar! You have '+kd.stars.count+(kd.stars.count===1?' star!':' stars!'));

  // ---------- header / countdown ----------
  function renderHeader(){
    var now=new Date();
    document.getElementById('dayName').textContent=DAYS[now.getDay()];
    var h=now.getHours(),m=now.getMinutes();
    document.getElementById('clock').textContent=((h%12)||12)+':'+pad(m)+(h<12?' am':' pm');
    var leave=cfg.days[now.getDay()].leave;
    var lbl=document.getElementById('cdLabel'),fill=document.getElementById('cdFill');
    var road=document.getElementById('road'),mover=document.getElementById('mover');
    function fmt(hm){var p=hm.split(':'),hh=+p[0];return ((hh%12)||12)+':'+p[1]+(hh<12?' am':' pm');}
    function setRoad(pct){ // 0 = start of the road, 100 = at the car
      road.style.display='';
      fill.style.width=pct+'%';
      mover.style.left='calc('+pct+'% * 0.86)';
    }
    var hdr=document.querySelector('header');
    lbl.classList.remove('big');hdr.classList.remove('centred');
    if(!leave){hdr.classList.add('centred');return;}
    var parts=leave.split(':');
    var lt=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+parts[0],+parts[1]);
    var mins=Math.ceil((lt-now)/60000);
    var window_=60; // the runner travels to the car over the last 60 minutes
    if(mins>window_){setRoad(0);lbl.textContent='Leave at '+fmt(leave);}
    else if(mins>0){setRoad((window_-mins)/window_*100);lbl.textContent='Leave at '+fmt(leave)+' · '+mins+' min';}
    else if(mins>-90){setRoad(100);lbl.classList.add('big');lbl.textContent='Time to go! 🚗';}
    else hdr.classList.add('centred'); // after the morning rush: just the day and time, centred
  }

  function upcoming(){
    var t=today0(),y=t.getFullYear(),out=[],specialDays={};
    function add(emoji,name,start,end,lead,speakName,extra){
      var d=daysBetween(t,start),endD=end?daysBetween(t,end):d;
      if(endD<0)return false;
      if(d>lead&&d>0)return true;
      out.push({emoji:emoji,name:name,days:Math.max(d,0),on:d<=0&&endD>=0&&end&&endD>0,speak:speakName||name,extra:extra||''});
      return true;
    }
    // built-in celebrations
    SPECIALS.forEach(function(x){
      var sp=cfg.specials[x[0]];if(!sp||!sp.on)return;
      var dt=specialDate(x[0],y);if(daysBetween(t,dt)<0)dt=specialDate(x[0],y+1);
      specialDays[ymd(dt)]=1;
      add(x[1],x[2],dt,null,sp.lead,x[2]);
    });
    // public holidays for the chosen state
    if(cfg.holidays.on){
      holidaysFor(y).concat(holidaysFor(y+1)).forEach(function(h){

      if(!ev.date)return;

        add(ev.emoji||'🎂',nm,occ,null,lead,sp);

    });

  }

    if(wx.rain>=70)parts.push('It will rain, so take your raincoat.');
    else if(wx.rain>=40)parts.push('It might rain, so take your raincoat.');
    var SPOKEN={'Dress or skirt':'a dress or skirt','Dress & tights':'a dress and tights','T-shirt':'a t-shirt','Jumper':'a jumper',
      'Warm jacket':'a warm jacket','Scarf':'a scarf','Pants or shorts':'pants or shorts'};
    function sp(x){return SPOKEN[x[1]]||x[1].toLowerCase();}
    var bot=o.wear.filter(function(x){return x[2]==='b';}).map(sp);
    var items=o.wear.filter(function(x){return x[2]!=='b'&&['Raincoat','Hat','Sunscreen'].indexOf(x[1])<0;}).map(sp);
    if(bot.length)items.unshift(bot.join(' or '));
    if(items.length){var last=items.pop();parts.push('Wear '+(items.length?items.join(', ')+(bot.length>1?', and ':' and '):'')+last+'.');}
    if(uvPeakAhead()>=uvLimit())parts.push('The sun will be strong today, so wear sunscreen and try and play in the shade. Don\'t forget your hat!');
    return parts.join(' ');
  }
  function speakWx(){
    keepAwake();
    if(!wx||wx.date!==today()){say('Sorry, I can\'t see the weather right now.');return;}
    say(weatherSpeech());
  }
  document.getElementById('wx').addEventListener('click',speakWx);
  var wxErr='';
  function fetchWx(){
    var L=cfg.loc;
    var url='https://api.open-meteo.com/v1/forecast?latitude='+L.lat+'&longitude='+L.lon+
      '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,weather_code,wind_speed_10m_max,wind_gusts_10m_max'+
      '&hourly=uv_index,weather_code,precipitation_probability&timezone=auto&forecast_days=2';
    try{
      fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){
        var d=j.daily;
        wx={date:today(),now:j.current.temperature_2m,code:d.weather_code[0],max:d.temperature_2m_max[0],min:d.temperature_2m_min[0],
            rain:d.precipitation_probability_max[0]||0,uv:d.uv_index_max[0]||0,at:Date.now(),
            wind:(d.wind_speed_10m_max&&d.wind_speed_10m_max[0])||0,gust:(d.wind_gusts_10m_max&&d.wind_gusts_10m_max[0])||0,
            hours:(j.hourly&&j.hourly.time)||[],uvh:(j.hourly&&j.hourly.uv_index)||[]};
        // Daily weather_code is the WORST weather of the whole day (one passing shower = rain cloud),
        // so pick the icon and rain chance from the daytime hours (7am–6pm) instead.
        var h=j.hourly||{},td=today(),cnt={sun:0,part:0,cloud:0,rain:0,storm:0,snow:0},dayRain=-1;
        (h.time||[]).forEach(function(t,i){
          if(t.slice(0,10)!==td)return;var hr=+t.slice(11,13);if(hr<7||hr>18)return;
          var c=(h.weather_code||[])[i],pp=(h.precipitation_probability||[])[i];
          if(pp!=null)dayRain=Math.max(dayRain,pp);
          if(c==null)return;
          if(c===0)cnt.sun++;else if(c<=2)cnt.part++;else if(c===3||c===45||c===48)cnt.cloud++;
          else if(c>=95)cnt.storm++;else if((c>=71&&c<=77)||c===85||c===86)cnt.snow++;else cnt.rain++;
        });
        var tot=cnt.sun+cnt.part+cnt.cloud+cnt.rain+cnt.storm+cnt.snow;
        if(tot){
          if(cnt.storm>=2)wx.code=95;
          else if(cnt.snow>=2)wx.code=71;
          else if(cnt.rain>=5)wx.code=61;          // rainy day
          else if(cnt.rain>=2)wx.code=80;          // some showers
          else wx.code=cnt.sun>=cnt.part&&cnt.sun>=cnt.cloud?0:(cnt.part>=cnt.cloud?2:3);
        }
        if(dayRain>=0)wx.rain=dayRain;
        wxErr='';save('qb_wx',wx);render();renderWx();
      }).catch(function(){wxErr='Open this board from its own web address to get live weather';renderWx();});
    }catch(e){wxErr='Weather blocked here';renderWx();}
  }
  setInterval(fetchWx,30*60000);

  render();
  renderWx();
  fetchWx();
  // Offline support + install as an app
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');}catch(e){}
  var installEvt=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;});
  window.addEventListener('appinstalled',function(){installEvt=null;});
  function isInstalled(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}catch(e){return false;}}
  fetchHolidays();setInterval(fetchHolidays,6*3600000);
})();
</script>
